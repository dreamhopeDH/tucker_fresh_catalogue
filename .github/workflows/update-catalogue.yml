name: Update production catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: read
  deployments: write

concurrency:
  group: tucker-catalogue-production-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MAX_PRODUCTS: "none"
      PAGE_SIZE: "9"
      B2_PREFIX: prod
      IMAGE_SYNC_BUDGET_SECONDS: "18000"
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ vars.B2_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run Python tests
        run: pytest

      - name: Run frontend type check
        working-directory: web
        run: npm run typecheck

      - name: Test and type-check Pages Function
        working-directory: web
        run: npm run test:functions && npm run typecheck:functions

      - name: Scrape and prepare catalogue data
        run: python -m src.main

      - name: Check deployment readiness
        id: readiness
        run: |
          if jq -e '.image_sync_complete == true' output/run-summary.json >/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image traversal is incomplete. Progress has been saved to the B2 manifest. Run the workflow again to continue. No new catalogue was deployed."
          fi

      - name: Build production site
        if: steps.readiness.outputs.deploy == 'true'
        working-directory: web
        run: npm run build

      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-debug-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            output/raw-products.json
            output/normalized-products.json
            output/grouping-result.json
            output/catalogue-manifest.json
            output/run-summary.json

      - name: Deploy to Cloudflare Pages
        if: steps.readiness.outputs.deploy == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy ../output/site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Write job summary
        if: always()
        env:
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
        run: |
          echo "## Tucker Fresh production catalogue" >> "$GITHUB_STEP_SUMMARY"
          if test -f output/run-summary.json; then
            echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Mode | $(jq -r 'if .mode == "full" then "Full catalogue" else "Limited catalogue" end' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Retrieval strategy | $(jq -r 'if .retrieval_strategy == "name_az_plus_name_za" then "Name A-Z + Name Z-A" elif .retrieval_strategy == "name_az" then "Name A-Z (Z-A not required)" else .retrieval_strategy end' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Source-advertised products | $(jq -r '.source_advertised_product_count // "unknown"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Name A-Z unique | $(jq -r '.name_az_unique_count // "not applicable"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Name Z-A unique | $(jq -r '.name_za_unique_count // "not required"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Alphabetical overlap | $(jq -r '.alphabetical_overlap_count // "not applicable"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Final union unique | $(jq -r '.final_union_unique_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Products scraped | $(jq -r '.actual_product_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Ordering | $(jq -r '.ordering_mode' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Ordering seed | $(jq -r '.ordering_seed' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Confirmed families | $(jq -r '.confirmed_family_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Standalone products | $(jq -r '.standalone_product_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Uncertain products | $(jq -r '.uncertain_product_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Display items | $(jq -r '.display_item_count // "pending"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| More than 50% off | $(jq -r '[.discount_groups[]? | select(.id == "over_50") | .item_count][0] // "pending"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Half price | $(jq -r '[.discount_groups[]? | select(.id == "exactly_50") | .item_count][0] // "pending"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 40% to 50% off | $(jq -r '[.discount_groups[]? | select(.id == "forty_to_under_50") | .item_count][0] // "pending"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Less than 40% off | $(jq -r '[.discount_groups[]? | select(.id == "under_40") | .item_count][0] // "pending"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Images downloaded this run | $(jq -r '.downloaded' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Images skipped from manifest | $(jq -r '.skipped' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Images missing | $(jq -r '.missing' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Images failed | $(jq -r '.failed' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Image sync complete | $(jq -r '.image_sync_complete' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Stopped after budget | $(jq -r '.stopped_after_budget' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Stopped after consecutive failures | $(jq -r '.stopped_after_failures' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Current products remaining | $(jq -r '.remaining' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Final pages | $(jq -r '.page_count // "pending"' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            if test "$(jq -r '.image_sync_complete' output/run-summary.json)" != "true"; then
              echo "> [!IMPORTANT] Image traversal is incomplete. Progress has been saved to the B2 manifest. Run the workflow again to continue. No new catalogue was deployed." >> "$GITHUB_STEP_SUMMARY"
            fi
            if test "$(jq -r '.stopped_after_failures' output/run-summary.json)" = "true"; then
              echo "> [!WARNING] Image requests stopped after 10 consecutive failures." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "> [!CAUTION] Pipeline summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Cloudflare Pages deployment result: **$DEPLOY_RESULT**" >> "$GITHUB_STEP_SUMMARY"
