name: Update test catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: read
  deployments: write

concurrency:
  group: tucker-catalogue-test-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAX_PRODUCTS: "100"
      PAGE_SIZE: "9"
      B2_PREFIX: test
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      IMAGE_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run Python tests
        run: pytest

      - name: Run frontend type check
        working-directory: web
        run: npm run typecheck

      - name: Scrape and build catalogue data
        run: python -m src.main

      - name: Build production site
        working-directory: web
        run: npm run build

      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-debug-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            output/raw-products.json
            output/normalized-products.json
            output/grouping-result.json
            output/catalogue-manifest.json

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output/site --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Write job summary
        if: always()
        env:
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
        run: |
          echo "## Tucker Fresh test catalogue" >> "$GITHUB_STEP_SUMMARY"
          if test -f output/run-summary.json; then
            echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Requested product limit | $(jq -r '.requested_product_limit' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Products scraped | $(jq -r '.actual_product_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Confirmed families | $(jq -r '.confirmed_family_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Standalone products | $(jq -r '.standalone_product_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Uncertain products | $(jq -r '.uncertain_product_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Images downloaded | $(jq -r '.downloaded' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Images skipped | $(jq -r '.skipped' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Images missing | $(jq -r '.missing' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Images failed | $(jq -r '.failed' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Final pages | $(jq -r '.page_count' output/run-summary.json) |" >> "$GITHUB_STEP_SUMMARY"
            if test "$(jq -r '.actual_product_count' output/run-summary.json)" -lt "$(jq -r '.requested_product_limit' output/run-summary.json)"; then
              echo "> [!WARNING] Fewer products were scraped than requested." >> "$GITHUB_STEP_SUMMARY"
            fi
            if test "$(jq -r '.stopped_after_failures' output/run-summary.json)" = "true"; then
              echo "> [!WARNING] Image requests stopped after 10 consecutive failures." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "> [!CAUTION] Pipeline summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Cloudflare Pages deployment result: **$DEPLOY_RESULT**" >> "$GITHUB_STEP_SUMMARY"
