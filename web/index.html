<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd900" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Tucker Fresh weekly catalogue</title>
  </head>
  <body>
    <header class="catalogue-header">
      <div>
        <p class="eyebrow">Weekly specials catalogue</p>
        <h1>Tucker Fresh weekly specials</h1>
      </div>
      <div class="header-actions">
        <button id="search-open" class="search-open" type="button" aria-label="Search catalogue" aria-haspopup="dialog" aria-controls="search-dialog" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m15.5 15.5 5 5"></path>
          </svg>
        </button>
        <div class="header-status">
          <button id="settings-open" class="settings-open" type="button" aria-label="Open settings" aria-haspopup="dialog" aria-controls="settings-dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"></path>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
            </svg>
          </button>
          <p id="status" role="status">Loading catalogue…</p>
        </div>
      </div>
    </header>
    <main>
      <div id="pages" class="pages" aria-label="Catalogue pages"></div>
    </main>
    <nav class="page-controls" aria-label="Page navigation">
      <button id="first" type="button" aria-label="First page">First</button>
      <button id="previous" type="button" aria-label="Previous page">‹</button>
      <label class="page-position" for="page-select">
        <span id="discount-group-label">Specials</span>
        <span id="page-label">Page</span>
      </label>
      <select id="page-select" aria-label="Jump to page"></select>
      <button id="next" type="button" aria-label="Next page">›</button>
    </nav>
    <dialog id="product-dialog" class="product-dialog" aria-labelledby="product-dialog-title">
      <div class="product-dialog-panel">
        <button id="product-dialog-close" class="product-dialog-close" type="button" aria-label="Close product details">×</button>
        <div class="product-dialog-scroll">
          <h2 id="product-dialog-title"></h2>
          <div id="product-dialog-content"></div>
        </div>
      </div>
    </dialog>
    <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
      <div class="search-panel">
        <button id="search-close" class="search-close" type="button" aria-label="Close search">×</button>
        <h2 id="search-title">Search specials</h2>
        <input id="search-input" type="search" inputmode="search" autocomplete="off" placeholder="Search product or variant" aria-describedby="search-summary" />
        <p id="search-summary" class="search-summary" role="status">Type a product name to search.</p>
        <div id="search-results" class="search-results" aria-label="Search results"></div>
      </div>
    </dialog>
    <dialog id="settings-dialog" class="search-dialog settings-dialog" aria-labelledby="settings-title">
      <div class="search-panel settings-panel">
        <button id="settings-close" class="search-close" type="button" aria-label="Close settings">×</button>
        <h2 id="settings-title">Settings</h2>
        <p class="settings-warning">Be careful, don't change the setting.</p>
        <div class="settings-colours" aria-label="Catalogue colours">
          <label for="colour-page">
            <span>Page background</span>
            <input id="colour-page" type="color" value="#ffd900" />
          </label>
          <label for="colour-price">
            <span>Price circle</span>
            <input id="colour-price" type="color" value="#ed1c24" />
          </label>
          <label for="colour-saving">
            <span>Saving label</span>
            <input id="colour-saving" type="color" value="#ffd900" />
          </label>
          <label for="colour-card">
            <span>Product boxes</span>
            <input id="colour-card" type="color" value="#ffffff" />
          </label>
        </div>
        <button id="settings-default" class="settings-default" type="button">Default</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
