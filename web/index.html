<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd900" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Tucker Fresh weekly catalogue</title>
  </head>
  <body>
    <header class="catalogue-header">
      <div>
        <p class="eyebrow">100-product test catalogue</p>
        <h1>Tucker Fresh weekly specials</h1>
      </div>
      <p id="status" role="status">Loading catalogue…</p>
    </header>
    <main>
      <div id="pages" class="pages" aria-label="Catalogue pages"></div>
    </main>
    <nav class="page-controls" aria-label="Page navigation">
      <button id="first" type="button" aria-label="First page">First</button>
      <button id="previous" type="button" aria-label="Previous page">‹</button>
      <label for="page-select"><span id="page-label">Page</span></label>
      <select id="page-select" aria-label="Jump to page"></select>
      <button id="next" type="button" aria-label="Next page">›</button>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
